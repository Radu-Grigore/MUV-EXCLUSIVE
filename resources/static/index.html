<!DOCTYPE html>
<html lang="ro">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#f7f1ea">

        <title>MUV Exclusive — Sală de fitness pentru femei în Ploiești | Boutique Fitness Studio</title>

        <meta property="og:type" content="website">
        <meta property="og:locale" content="ro_RO">
        <meta property="og:title" content="MUV Exclusive — Women Only Fitness Studio">
        <meta property="og:description" content="More than a workout. A better you. Deschidere oficială 01.11.2026, Ploiești.">
        <meta property="og:image" content="images/campaign.webp">

        <link rel="icon" href="favicon.svg" type="image/svg+xml">
        <link rel="preload" as="image" href="images/athlete.webp" fetchpriority="high">

        <script type="module" src="../js/static.tsx"></script>
    </head>
    <body class="min-h-screen font-sans antialiased">
        <div id="app"></div>
        <div id="boot" class="fixed inset-0 z-[100] flex flex-col bg-espresso text-cream" aria-hidden="true">
            <div class="flex-1"></div>
            <div class="flex items-end justify-between px-5 pb-8 sm:px-12">
                <span class="eyebrow text-gold-soft">Women only fitness studio</span>
                <span class="font-display text-5xl text-cream tabular-nums sm:text-7xl">000</span>
            </div>
        </div>
        <noscript><p style="padding:2rem;text-align:center;font-family:sans-serif">Activează JavaScript pentru a vedea site-ul MUV Exclusive.</p></noscript>
        <script>
            // If the app fails to start, show the error instead of an empty page.
            window.addEventListener('error', function (e) {
                var app = document.getElementById('app');
                if (app && !app.firstChild) {
                    app.innerHTML = '<p style="padding:2rem;font-family:sans-serif;color:#2a201a">Site-ul nu a putut porni: ' + String(e.message || e.error).replace(/</g, '&lt;') + '</p>';
                }
            });
        </script>
    </body>
</html>
